<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; display:block;">
  <defs>
    <linearGradient id="hdrSky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="55%" stop-color="#1B2333"/>
      <stop offset="100%" stop-color="#3A2E1F"/>
    </linearGradient>
    <radialGradient id="hdrNoor" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#FFF4D6" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#D4AF6A" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#8A7048" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hdrDome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D6"/>
      <stop offset="45%" stop-color="#D4AF6A"/>
      <stop offset="100%" stop-color="#8A7048"/>
    </linearGradient>
    <linearGradient id="hdrDomeShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A7048"/>
      <stop offset="50%" stop-color="#FFF4D6"/>
      <stop offset="100%" stop-color="#8A7048"/>
    </linearGradient>
    <linearGradient id="hdrWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232E42"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="480" fill="url(#hdrSky)"/>

  <!-- نور کی کرنیں -->
  <circle cx="500" cy="230" r="300" fill="url(#hdrNoor)"/>
  <g stroke="#FFF4D6" stroke-width="1" opacity="0.18">
    <line x1="500" y1="230" x2="500" y2="10"/>
    <line x1="500" y1="230" x2="230" y2="70"/>
    <line x1="500" y1="230" x2="770" y2="70"/>
    <line x1="500" y1="230" x2="120" y2="230"/>
    <line x1="500" y1="230" x2="880" y2="230"/>
    <line x1="500" y1="230" x2="230" y2="390"/>
    <line x1="500" y1="230" x2="770" y2="390"/>
  </g>

  <!-- کبوتر طواف کرتے ہوئے -->
  <g fill="#EFE6D3" opacity="0.9">
    <path d="M160 150 q10 -10 20 0 q10 -10 20 0 q-10 12 -20 16 q-10 -4 -20 -16 Z"/>
    <path d="M820 130 q10 -10 20 0 q10 -10 20 0 q-10 12 -20 16 q-10 -4 -20 -16 Z"/>
    <path d="M240 90 q9 -9 18 0 q9 -9 18 0 q-9 11 -18 14 q-9 -3 -18 -14 Z"/>
    <path d="M740 250 q9 -9 18 0 q9 -9 18 0 q-9 11 -18 14 q-9 -3 -18 -14 Z"/>
    <path d="M120 260 q8 -8 16 0 q8 -8 16 0 q-8 10 -16 13 q-8 -3 -16 -13 Z"/>
    <path d="M860 300 q8 -8 16 0 q8 -8 16 0 q-8 10 -16 13 q-8 -3 -16 -13 Z"/>
    <path d="M340 60 q7 -7 14 0 q7 -7 14 0 q-7 9 -14 12 q-7 -3 -14 -12 Z"/>
  </g>

  <!-- گنبد کا چبوترہ / عمارت -->
  <rect x="330" y="330" width="340" height="140" fill="url(#hdrWall)"/>
  <g stroke="#D4AF6A" stroke-width="1" opacity="0.25">
    <line x1="380" y1="330" x2="380" y2="470"/>
    <line x1="430" y1="330" x2="430" y2="470"/>
    <line x1="480" y1="330" x2="480" y2="470"/>
    <line x1="520" y1="330" x2="520" y2="470"/>
    <line x1="570" y1="330" x2="570" y2="470"/>
    <line x1="620" y1="330" x2="620" y2="470"/>
  </g>
  <rect x="470" y="380" width="60" height="90" fill="#0A0E1A" stroke="#D4AF6A" stroke-width="1.5" opacity="0.8"/>
  <path d="M470 380 Q500 350 530 380 Z" fill="#0A0E1A" stroke="#D4AF6A" stroke-width="1.5" opacity="0.8"/>

  <!-- میناریں -->
  <g>
    <rect x="300" y="230" width="18" height="200" fill="url(#hdrWall)" stroke="#8A7048" stroke-width="1"/>
    <polygon points="309,180 300,230 318,230" fill="url(#hdrDome)"/>
    <circle cx="309" cy="172" r="5" fill="url(#hdrDome)"/>
  </g>
  <g>
    <rect x="682" y="230" width="18" height="200" fill="url(#hdrWall)" stroke="#8A7048" stroke-width="1"/>
    <polygon points="691,180 682,230 700,230" fill="url(#hdrDome)"/>
    <circle cx="691" cy="172" r="5" fill="url(#hdrDome)"/>
  </g>

  <!-- سنہری گنبد -->
  <path d="M400 330 C400 230 320 190 500 130 C680 190 600 230 600 330 Z" fill="url(#hdrDome)"/>
  <path d="M500 130 C560 165 585 220 590 275 L500 250 Z" fill="url(#hdrDomeShade)" opacity="0.35"/>
  <g stroke="#8A7048" stroke-width="1" opacity="0.4">
    <path d="M500 130 C460 175 440 250 440 330"/>
    <path d="M500 130 C540 175 560 250 560 330"/>
    <path d="M500 130 C500 210 500 270 500 330"/>
  </g>
  <rect x="392" y="322" width="216" height="16" fill="url(#hdrDome)"/>
  <circle cx="500" cy="112" r="7" fill="url(#hdrDome)"/>
  <line x1="500" y1="130" x2="500" y2="90" stroke="url(#hdrDome)" stroke-width="3"/>
  <path d="M500 90 L490 78 L500 66 L510 78 Z" fill="url(#hdrDome)"/>

  <!-- عنوان -->
  <text x="500" y="450" fill="#FFF4D6" font-family="'Amiri', serif" font-size="30" font-weight="700" text-anchor="middle" opacity="0.92">حرمِ امام علی النقی علیہ السلام</text>
</svg>
