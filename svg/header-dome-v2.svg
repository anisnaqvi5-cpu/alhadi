  <g stroke="url(#hdrDomeRib)" stroke-width="2" opacity="0.55" fill="none">
    <path d="M500 92 C486 150 470 230 458 305"/>
    <path d="M500 92 C500 150 500 230 500 305"/>
    <path d="M500 92 C514 150 530 230 542 305"/>
    <path d="M500 92 C472 150 435 230 418 305"/>
    <path d="M500 92 C528 150 565 230 582 305"/>
