  <circle cx="500" cy="92" r="8" fill="url(#hdrDomeGold)"/>
  <circle cx="500" cy="60" r="6" fill="url(#hdrDomeGold)"/>
  <path d="M500 46 L486 30 L500 14 L514 30 Z" fill="url(#hdrDomeGold)"/>

  <!-- عنوان -->
  <text x="500" y="490" fill="#FFF4D6" font-family="'Amiri', serif" font-size="30" font-weight="700" text-anchor="middle" opacity="0.94">حرمِ امام علی النقی علیہ السلام</text>
