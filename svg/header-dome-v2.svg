<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; display:block;">
  <defs>
    <linearGradient id="hdrSky2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="50%" stop-color="#141B2C"/>
      <stop offset="100%" stop-color="#2E2416"/>
    </linearGradient>
    <radialGradient id="hdrNoor2" cx="50%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#FFF9E6" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FFF4D6" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#D4AF6A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#060810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hdrDomeGold" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8A7048"/>
      <stop offset="30%" stop-color="#FFF4D6"/>
